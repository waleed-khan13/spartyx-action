name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the runtime action.yml declares, so the tests run on what
      # GitHub will actually hand the action. Node 20 is deprecated for
      # actions - runners already force those onto 24 with a warning.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Parsing and comment building
        run: node --test index.test.js

      - name: The whole action, against stub servers
        run: node --test e2e.test.js
